<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Desk - Reportar Incidente</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-uppercase text-primary" href="index.html">UTM HelpDesk</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="reportar.html">Reportar Incidente</a></li>
                    <li class="nav-item"><a class="nav-link" href="tickets.html">Ver Tickets</a></li>
                </ul>
            </div>
        </div>
    </nav>
    
    <!-- CONTENIDO PRINCIPAL: Formulario de incidencias adaptado a entornos móviles -->
<main class="container mt-4">
    
    <!-- Encabezado de la sección -->
    <section class="row mb-4">
        <div class="col-12">
            <h2 class="fw-bold">Reportar Nuevo Incidente</h2>
            <p class="text-muted">Por favor, detalle la falla de infraestructura detectada para la asignación de un técnico.</p>
        </div>
    </section>

    <!-- Contenedor del Formulario: Centrado en PC, ancho total en móvil -->
    <section class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            
            <!-- Tarjeta contenedora para el formulario -->
            <div class="card shadow-sm p-4">
                <form action="#" method="POST">
                    
                    <!-- Campo 1: Título o Asunto del problema -->
                    <!-- 'form-label' y 'form-control' aseguran el 100% de ancho fluido -->
                    <div class="mb-3">
                        <label for="asunto" class="form-label fw-semibold">Asunto del Incidente:</label>
                        <input type="text" id="asunto" name="asunto" class="form-control" placeholder="Ej. Caída de red en Laboratorio 3" required>
                    </div>

                    <!-- Campo 2: Categoría o Área del fallo -->
                    <div class="mb-3">
                        <label for="categoria" class="form-label fw-semibold">Categoría del Fallo:</label>
                        <select id="categoria" name="categoria" class="form-select" required>
                            <option value="" selected disabled>Seleccione una categoría...</option>
                            <option value="redes">Infraestructura de Red / Conectividad</option>
                            <option value="hardware">Servidores y Hardware del Data Center</option>
                            <option value="software">Sistemas y Plataformas UTM</option>
                        </select>
                    </div>

                    <!-- Campo 3: Descripción detallada -->
                    <div class="mb-4">
                        <label for="descripcion" class="form-label fw-semibold">Descripción del Problema:</label>
                        <textarea id="descripcion" name="descripcion" class="form-control" rows="4" placeholder="Describa de forma detallada los síntomas del error..." required></textarea>
                    </div>

                    <!-- Botones del Sistema utilizando tus clases de la librería UI Kit -->
                    <!-- 'w-100' hace que en celulares se estiren a lo ancho para presionarlos mejor -->
                    <div class="d-flex flex-column flex-sm-row gap-2">
                        <button type="submit" class="btn btn-primary w-100">Enviar Reporte</button>
                        <a href="index.html" class="btn btn-secondary w-100 text-center">Cancelar</a>
                    </div>

                </form>
            </div><!-- Fin de la tarjeta -->

        </div>
    </section>
</main>

<!-- PIE DE PÁGINA -->
<footer class="container text-center py-4 mt-5 border-top">

</body>
</html>
